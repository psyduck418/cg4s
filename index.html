<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG4S - 遊戲與應用安全通道</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #0b0f19; color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            padding: 10px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #1e293b;
            box-sizing: border-box; transition: transform 0.3s ease; z-index: 1000;
        }
        .top-bar.hidden { transform: translateY(-100%); }
        .top-bar input {
            flex: 1; padding: 8px 14px; font-size: 14px;
            background-color: #1e293b; border: 1px solid #334155;
            color: white; border-radius: 6px; margin: 0 15px; outline: none;
        }
        .top-bar input:focus { border-color: #3b82f6; }
        .top-bar button {
            padding: 8px 16px; background-color: #3b82f6;
            color: white; border: none; border-radius: 6px; cursor: pointer;
            font-weight: 500;
        }
        .top-bar button:hover { background-color: #2563eb; }
        .quick-links {
            display: flex; gap: 8px; margin-right: 15px;
        }
        .quick-links button {
            background-color: #334155; font-size: 13px; padding: 6px 12px;
        }
        .quick-links button:hover { background-color: #475569; }
        #toggleBtn {
            position: fixed; top: 10px; right: 10px;
            background-color: rgba(15, 23, 42, 0.8); color: #cbd5e1;
            border: 1px solid #334155; padding: 6px 12px; border-radius: 6px;
            cursor: pointer; z-index: 1001; font-size: 12px; display: none;
        }
        #toggleBtn:hover { background-color: #3b82f6; color: white; }
        #proxyFrame { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <h3 style="margin: 0; font-size: 16px; color: #38bdf8;">CG4S</h3>
        <div class="quick-links">
            <button onclick="quickLoad('https://www.crazygames.com')">CrazyGames</button>
        </div>
        <input type="text" id="targetUrl" placeholder="輸入網址，例如 https://www.crazygames.com" />
        <button onclick="loadSite()">前往</button>
        <button onclick="toggleBar()" style="background-color: #334155; margin-left: 6px;">隱藏</button>
    </div>

    <button id="toggleBtn" onclick="toggleBar()">⚙️ 選單</button>
    <iframe id="proxyFrame"></iframe>

    <script>
        const iframe = document.getElementById('proxyFrame');
        const urlInput = document.getElementById('targetUrl');

        function quickLoad(url) {
            urlInput.value = url;
            loadSite();
        }

        function loadSite() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            // 透過 Cloudflare 代理路由載入
            iframe.src = '/proxy?url=' + encodeURIComponent(url);
            toggleBar();
        }

        function toggleBar() {
            const bar = document.getElementById('topBar');
            const btn = document.getElementById('toggleBtn');
            if (bar.classList.contains('hidden')) {
                bar.classList.remove('hidden');
                btn.style.display = 'none';
            } else {
                bar.classList.add('hidden');
                btn.style.display = 'block';
            }
        }
    </script>
</body>
</html>
