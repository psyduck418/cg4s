<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CG4S - 遊戲專用通道</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #121212; color: #ffffff;
            font-family: Arial, sans-serif; overflow: hidden;
        }
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            background-color: rgba(31, 31, 31, 0.95);
            padding: 8px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #333;
            box-sizing: border-box; transition: transform 0.3s ease; z-index: 1000;
        }
        .top-bar.hidden { transform: translateY(-100%); }
        .top-bar input {
            flex: 1; padding: 6px 12px; font-size: 14px;
            background-color: #2b2b2b; border: 1px solid #444;
            color: white; border-radius: 4px; margin: 0 15px; outline: none;
        }
        .top-bar button {
            padding: 6px 14px; background-color: #3b82f6;
            color: white; border: none; border-radius: 4px; cursor: pointer;
        }
        .top-bar button:hover { background-color: #2563eb; }
        #toggleBtn {
            position: fixed; top: 10px; right: 10px;
            background-color: rgba(0, 0, 0, 0.7); color: white;
            border: 1px solid #555; padding: 6px 12px; border-radius: 4px;
            cursor: pointer; z-index: 1001; font-size: 12px; display: none;
        }
        #gameFrame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <h3>CG4S</h3>
        <input type="text" id="targetUrl" placeholder="輸入遊戲網址，例如 https://krunker.io" />
        <button onclick="loadGame()">載入</button>
        <button onclick="toggleBar()" style="background-color: #444; margin-left: 5px;">隱藏</button>
    </div>

    <button id="toggleBtn" onclick="toggleBar()">⚙️ 選單</button>
    <iframe id="gameFrame"></iframe>

    <script>
        const iframe = document.getElementById('gameFrame');
        const urlInput = document.getElementById('targetUrl');

        function loadGame() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            // 透過我們自己的 Cloudflare 代理通道載入
            iframe.src = '/proxy?url=' + encodeURIComponent(url);
            toggleBar();
        }

        function toggleBar() {
            const bar = document.getElementById('topBar');
            const btn = document.getElementById('toggleBtn');
            if (bar.classList.contains('hidden')) {
                bar.classList.remove('hidden');
                btn.style.display = 'none';
            } else {
                bar.classList.add('hidden');
                btn.style.display = 'block';
            }
        }
    </script>
</body>
</html>
